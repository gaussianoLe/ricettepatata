name: Foundation CI
on:
  pull_request:
  push:
    branches: [main, feat/p1.2-first-catalog-batch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Check, build and browser (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: production
            target: production
            base: /
            site: https://ricettepatata.it
          - id: preview
            target: preview
            base: /anteprima/
            site: https://ricettepatata.it
          - id: production-custom-growth
            target: production
            base: /magazine/
            site: https://cucina.example
            growth: true
          - id: preview-root-http
            target: preview
            base: /
            site: http://localhost:4321
    env:
      TEST_TARGET: ${{ matrix.target }}
      BUILD_TARGET: ${{ matrix.target }}
      BASE_PATH: ${{ matrix.base }}
      SITE_URL: ${{ matrix.site }}
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exercise editorial states, variants and catalog growth
        if: matrix.growth
        run: node tests/helpers/catalog-fixtures.mjs add
      - run: npm run check
      - run: npm run catalog:check
      - run: node --test tests/core.test.mjs tests/catalog-model.test.mjs tests/catalog-import.test.mjs tests/catalog-batch.test.mjs
      - name: Build static magazine
        run: node scripts/build.mjs ${{ matrix.target }}
      - run: node --test tests/output.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Remove synthetic catalog fixtures
        if: always() && matrix.growth
        run: node tests/helpers/catalog-fixtures.mjs remove
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.id }}
          path: test-results/
          retention-days: 7
